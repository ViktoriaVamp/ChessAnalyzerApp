services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    expose:
      - "8080"
    deploy:
      replicas: 2 
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - chess_net

  nginx:
    image: nginx:alpine
    container_name: chess-load-balancer
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - chess_net

networks:
  chess_net:
    driver: bridge